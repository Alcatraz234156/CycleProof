AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CycleProof serverless backend - API, evidence storage, reconciliation, scheduled checks, monitoring, and alerts.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 20
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref CycleProofTable
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        ALERT_TOPIC_ARN: !Ref AlertTopic
        APP_ENV: !Ref AppEnvironment
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        DISCREPANCY_TOLERANCE_PCT: !Ref DiscrepancyTolerancePct
    LoggingConfig:
      LogFormat: JSON

Parameters:
  AppEnvironment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact frontend origin for CORS (API and evidence bucket). Do not use * for production.
  DiscrepancyTolerancePct:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 100
    Description: Default tolerance (percent) before a quantity difference is flagged.

Resources:
  CycleProofApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cycleproof-${AppEnvironment}-api
      StageName: v1
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
      # Gateway-generated errors (throttling, bad route, 5xx) also need CORS headers,
      # otherwise the browser reports a confusing CORS failure instead of the real error.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100

  CycleProofTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cycleproof-${AppEnvironment}-records
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI1: list records by entity type (claims, discrepancies, ...), newest first
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI2: everything that belongs to one claim (evidence, discrepancies, timeline, notifications)
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cycleproof-${AppEnvironment}-evidence-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['content-type', 'content-length']
            MaxAge: 3000

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub '${EvidenceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cycleproof-${AppEnvironment}-alerts
      KmsMasterKeyId: alias/aws/sns

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cycleproof-${AppEnvironment}-api-handler
      CodeUri: src/
      Handler: app.api_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CycleProofTable
        # Least privilege: presigned PUT/GET and HeadObject only, evidence prefix only.
        # s3:ListBucket makes HeadObject return 404 (not 403) for a missing object.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub '${EvidenceBucket.Arn}/evidence/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt EvidenceBucket.Arn
      Events:
        # One proxy route; src/app.py owns routing and returns 404/405 for unknown paths.
        # See backend/README.md for the full route list.
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref CycleProofApi
            Path: /{proxy+}
            Method: ANY

  ScheduledReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cycleproof-${AppEnvironment}-scheduled-reconciliation
      CodeUri: src/
      Handler: app.scheduled_handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CycleProofTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
      Events:
        NightlyReconciliation:
          Type: Schedule
          Properties:
            Name: !Sub cycleproof-${AppEnvironment}-nightly-reconciliation
            Description: Re-check claims that are not yet reconciled and issue review alerts.
            Schedule: cron(0 2 * * ? *)
            Enabled: true
            Input: '{"source":"cycleproof.schedule"}'

  ApiFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cycleproof-${AppEnvironment}-api-lambda-errors
      AlarmDescription: Alert when the CycleProof API Lambda reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ScheduledFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cycleproof-${AppEnvironment}-scheduled-errors
      AlarmDescription: Alert when scheduled reconciliation reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScheduledReconciliationFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL (use as VITE_API_BASE_URL)
    Value: !Sub 'https://${CycleProofApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
  DynamoDBTableName:
    Value: !Ref CycleProofTable
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  AlertTopicArn:
    Value: !Ref AlertTopic
