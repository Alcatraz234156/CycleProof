<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Heat-risk screening bands by apparent temperature: Lower below 27, Moderate 27 to 31.9, High 32 to 40.9, Very high 41 and above" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .band { font-weight: 800; font-size: 20px; }
    .range { font-weight: 600; font-size: 14px; }
    .tick { font-weight: 600; font-size: 13px; fill: #8b8680; }
  </style>
  <rect width="900" height="190" rx="18" fill="#161513"/>

  <!-- bands: 40..860 -->
  <clipPath id="bar"><rect x="40" y="62" width="820" height="56" rx="14"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="40"  y="62" width="200" height="56" fill="#22d3c5"/>
    <rect x="240" y="62" width="150" height="56" fill="#ffd60a"/>
    <rect x="390" y="62" width="280" height="56" fill="#ff8c00"/>
    <rect x="670" y="62" width="190" height="56" fill="#d62828"/>
  </g>

  <g class="band" text-anchor="middle">
    <text x="140" y="96" fill="#0b2f2c">Lower</text>
    <text x="315" y="96" fill="#3a2e00">Moderate</text>
    <text x="530" y="96" fill="#2e1700">High</text>
    <text x="765" y="96" fill="#ffffff">Very high</text>
  </g>

  <g class="range" text-anchor="middle" fill="#f5efe8">
    <text x="140" y="146">&lt; 27°C</text>
    <text x="315" y="146">27 – 31.9°C</text>
    <text x="530" y="146">32 – 40.9°C</text>
    <text x="765" y="146">≥ 41°C</text>
  </g>

  <!-- threshold ticks -->
  <g class="tick" text-anchor="middle">
    <text x="240" y="170">27</text>
    <text x="390" y="170">32</text>
    <text x="670" y="170">41</text>
  </g>

  <!-- marker for the worked example: 40.7 °C (just under 41) -->
  <g transform="translate(661 0)">
    <path d="M0 58 l-9 -16 h18 z" fill="#fff3c4">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <rect x="-1.5" y="58" width="3" height="64" fill="#fff3c4" opacity="0.9"/>
    <text x="0" y="30" text-anchor="middle" fill="#fff3c4" font-weight="700" font-size="14">example: 40.7°C</text>
  </g>
</svg>
