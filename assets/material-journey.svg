<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Material journey: Collected, Received, Processed, Recovered, Dispatched. One stage is highlighted as an illustrative discrepancy to investigate." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.l{font-weight:700;font-size:17px;fill:#e8f5ef}.s{font-size:13px;fill:#8fb3a6}</style>
  <rect width="1000" height="200" rx="20" fill="#0b1f1a"/>
  <path id="p" d="M100 84H900" stroke="#2ee6a0" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="100" cy="84" r="22" fill="#b8f05a"/><circle cx="300" cy="84" r="22" fill="#6fe58a"/>
    <circle cx="500" cy="84" r="22" fill="#2ee6a0"/><circle cx="700" cy="84" r="22" fill="#3fd6c8"/><circle cx="900" cy="84" r="22" fill="#5ad7f0"/>
    <circle cx="500" cy="84" r="22" fill="none" stroke="#ffb020" stroke-width="4"><animate attributeName="r" values="22;38;22" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="7" fill="#fff"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
  <g text-anchor="middle">
    <text x="100" y="140" class="l">Collected</text><text x="300" y="140" class="l">Received</text><text x="500" y="140" class="l">Processed</text><text x="700" y="140" class="l">Recovered</text><text x="900" y="140" class="l">Dispatched</text>
    <text x="500" y="168" class="s" fill="#ffb020" style="fill:#ffb020">illustrative flag: compare, then investigate</text>
  </g>
</svg>
