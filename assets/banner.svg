<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="CycleProof: making e-waste recycling claims easier to inspect, reconcile, and review" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f1a"/><stop offset=".6" stop-color="#0f2f27"/><stop offset="1" stop-color="#14473a"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8f05a"/><stop offset=".6" stop-color="#2ee6a0"/><stop offset="1" stop-color="#5ad7f0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#2ee6a0" stop-opacity=".35"/><stop offset="1" stop-color="#2ee6a0" stop-opacity="0"/></radialGradient>
    <clipPath id="r"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- faint circuit grid -->
    <g stroke="#2ee6a0" stroke-opacity=".07" stroke-width="1">
      <path d="M0 80H1200M0 160H1200M0 240H1200M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
    </g>
    <circle cx="960" cy="160" r="190" fill="url(#glow)"><animate attributeName="r" values="170;205;170" dur="6s" repeatCount="indefinite"/></circle>

    <!-- orbit of five stages -->
    <g transform="translate(960 160)">
      <circle r="100" fill="none" stroke="#2ee6a0" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="60s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <circle cx="0" cy="-100" r="13" fill="#b8f05a"/>
        <circle cx="95.1" cy="-30.9" r="13" fill="#6fe58a"/>
        <circle cx="58.8" cy="80.9" r="13" fill="#2ee6a0"/>
        <circle cx="-58.8" cy="80.9" r="13" fill="#3fd6c8"/>
        <circle cx="-95.1" cy="-30.9" r="13" fill="#5ad7f0"/>
        <circle cx="58.8" cy="80.9" r="22" fill="none" stroke="#ffb020" stroke-width="3"><animate attributeName="r" values="16;28;16" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></circle>
      </g>
      <circle r="52" fill="#0b1f1a" stroke="#2ee6a0" stroke-width="3"/>
      <path d="M-22 2 L-6 18 L24 -16" fill="none" stroke="#b8f05a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="60" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="92" fill="url(#t)" letter-spacing="-2">CycleProof</text>
    <text x="64" y="196" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="500" font-size="26" fill="#e8f5ef">Making e-waste recycling claims easier to</text>
    <text x="64" y="230" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="500" font-size="26" fill="#e8f5ef">inspect, reconcile, and review.</text>
    <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">
      <rect x="64" y="256" width="96" height="28" rx="14" fill="#b8f05a"/><text x="112" y="275" text-anchor="middle" fill="#0b1f1a">INSPECT</text>
      <rect x="172" y="256" width="118" height="28" rx="14" fill="#2ee6a0"/><text x="231" y="275" text-anchor="middle" fill="#0b1f1a">RECONCILE</text>
      <rect x="302" y="256" width="96" height="28" rx="14" fill="#5ad7f0"/><text x="350" y="275" text-anchor="middle" fill="#0b1f1a">REVIEW</text>
    </g>
  </g>
</svg>
