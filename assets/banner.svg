<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ShiftCool: heat-safety guidance and drinking-water information for outdoor workers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161513"/>
      <stop offset="0.55" stop-color="#2b1510"/>
      <stop offset="1" stop-color="#4a1d12"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="0.5" stop-color="#ff4d2e"/>
      <stop offset="1" stop-color="#22d3c5"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3c5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3c5" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- glowing sun -->
    <g transform="translate(980 110)">
      <circle r="150" fill="url(#sun)">
        <animate attributeName="r" values="140;165;140" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#ffb000" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <line x1="0" y1="-78" x2="0" y2="-108"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(30)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(60)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(90)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(120)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(150)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(180)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(210)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(240)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(270)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(300)"/>
        <line x1="0" y1="-78" x2="0" y2="-108" transform="rotate(330)"/>
      </g>
      <circle r="62" fill="#ffb000"/>
      <circle r="62" fill="none" stroke="#fff3c4" stroke-width="3" opacity="0.7"/>
    </g>

    <!-- shimmering heat waves -->
    <g fill="none" stroke="#ff4d2e" stroke-linecap="round" stroke-width="3" opacity="0.5">
      <path d="M-20 238 q40 -22 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M-20 262 q40 -22 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#ffb000" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" from="-160 0" to="0 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- cool water band -->
    <path d="M0 286 q75 -22 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V320 H0 Z" fill="url(#water)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 300 q75 -18 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V320 H0 Z" fill="#22d3c5" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="-300 0;0 0" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- droplet -->
    <g transform="translate(88 92)">
      <path d="M0 -34 C 22 -6, 28 6, 28 18 a28 28 0 0 1 -56 0 C -28 6, -22 -6, 0 -34 Z" fill="#22d3c5">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M-10 14 a12 12 0 0 0 10 12" fill="none" stroke="#d6f7f4" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- text -->
    <text x="150" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="92" fill="url(#title)" letter-spacing="-2">ShiftCool</text>
    <text x="154" y="195" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="26" fill="#f5efe8">Heat-safety guidance &amp; drinking-water information</text>
    <text x="154" y="228" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="26" fill="#f5efe8">for outdoor workers</text>

    <!-- chips -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
      <rect x="154" y="246" width="200" height="28" rx="14" fill="#ff4d2e"/>
      <text x="254" y="265" text-anchor="middle" fill="#fff">UNDERSTAND THE HEAT</text>
      <rect x="366" y="246" width="150" height="28" rx="14" fill="#ffb000"/>
      <text x="441" y="265" text-anchor="middle" fill="#161513">PLAN THE SHIFT</text>
      <rect x="528" y="246" width="170" height="28" rx="14" fill="#22d3c5"/>
      <text x="613" y="265" text-anchor="middle" fill="#161513">FIND WATER NEARBY</text>
    </g>
  </g>
</svg>
